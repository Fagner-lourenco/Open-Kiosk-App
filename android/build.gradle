// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // JitPack para usb-serial-for-android (usado por capacitor-usb-serial-plugin)
        maven { url 'https://jitpack.io' }
        // PagSeguro PlugPag SDK 4.x — repositório Maven oficial
        // Ref: https://github.com/nicfrezza/plugpag (mirror verificado do PagSeguro)
        maven { url 'https://raw.githubusercontent.com/nicfrezza/plugpag/master/4.x.x/' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
